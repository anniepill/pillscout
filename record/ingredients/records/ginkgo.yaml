# ----------------------------------------------------------------------
# Seizure risk profile
# ----------------------------------------------------------------------

seizure_risk_profile:
  mechanism_summary: "EMA HMPC monograph 4.4 (well-established use column) states that in patients with epilepsy, onset of further seizures promoted by intake of Ginkgo preparations cannot be excluded. The monograph articulates no mechanism. The EMA assessment report carries the mechanism claim and hedges it as an argument rather than a finding: it has been argued that this might be associated with the 4'-O-methylpyridoxine content. The assessment report's single dose toxicity section (3.3.1, Leistner and Drewke 2010 review) separately reports that extracts derived from dried Ginkgo biloba leaves contain ginkgotoxin, at between 11.4 and 58.62 micrograms in a recommended maximum daily dose (120-240 mg), and that a dosage of 11 mg/kg of isolated ginkgotoxin triggered seizures in guinea pigs. No held source states that ginkgotoxin and 4'-O-methylpyridoxine are the same compound, so this record does not collapse them. WHO Vol 1 1999 does not address seizure risk (zero occurrences of seizure, convulsion or epilepsy in its Folium Ginkgo monograph)."
  driver_constituent: ginkgotoxin
  citations:
    - citation_status: cited
      source: ema_hmpc
      document_id: EMA/HMPC/321097/2012
