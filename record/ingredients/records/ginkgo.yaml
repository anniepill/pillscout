        anchor_id: "b68be835bfac09a6"
        verbatim: "An extract similar to the monograph relevant\nextract was tested in a series of studies for\ngenotoxicity and carcinogenicity. It was positive\nfor gene mutation in bacteria."
        evidence_methodology: in_vitro
        evidence_outcome: positive_finding
        evaluation_status: evaluated
        interaction_axis: [not_applicable]
        axis_dose_dependence: not_reported
      - citation_status: cited
        source: ema_hmpc
        document_id: EMA/HMPC/321097/2012
        document_published_date: 2015-01-28
        section: "5.3"
        section_title: "Preclinical safety data"
        evidence_locator: "Well-established use column, Mutagenicity, carcinogenicity heading, second paragraph, micronucleus test sentence"
        scope: ["Well-established use"]
        anchor_id: "cdbfec4007f3f1f5"
