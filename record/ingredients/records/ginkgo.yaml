# ----------------------------------------------------------------------
# Preclinical safety
# ----------------------------------------------------------------------

preclinical_safety:
  status: present
  chronic_toxicity:
    citations:
      - citation_status: cited
        source: ema_hmpc
        document_id: EMA/HMPC/321097/2012
        document_published_date: 2015-01-28
        section: "5.3"
        section_title: "Preclinical safety data"
        evidence_locator: "Well-established use column, Chronic toxicity heading, full paragraph"
        scope: ["Well-established use"]
        anchor_id: "058e0f562c648042"
        verbatim: "Chronic toxicity was tested orally over 6 months\nin rats and dogs with daily dosages of 20 and\n100 mg/kg BW (corresponding to safety factor of\nup to 3.3 in rats and 11.6 in dogs), as well as with\nincremental doses of 300, 400 and 500 mg/kg BW\n(rat) or 300 and 400 mg/kg BW (dog)\n(corresponding to a safety factor of up to 16.8 in\nrats and 46.3 in dogs). The results showed only\nfor dogs a low toxicity in the highest dosage\ngroup."
        evidence_methodology: animal_study
        evidence_outcome: positive_finding
        evaluation_status: evaluated
        interaction_axis: [not_applicable]
        axis_dose_dependence: not_reported
  carcinogenicity:
    citations:
      - citation_status: cited
        source: ema_hmpc
        document_id: EMA/HMPC/321097/2012
        document_published_date: 2015-01-28
        section: "5.3"
        section_title: "Preclinical safety data"
        evidence_locator: "Well-established use column, Mutagenicity, carcinogenicity heading, first paragraph"
        scope: ["Well-established use"]
        anchor_id: "767e30059302a9cc"
