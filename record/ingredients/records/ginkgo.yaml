        evaluation_status: not_evaluated
        interaction_axis: [not_applicable]
        axis_dose_dependence: not_reported
      - citation_status: cited
        source: ema_hmpc
        document_id: EMA/HMPC/321097/2012
        document_published_date: 2015-01-28
        section: "5.3"
        section_title: "Preclinical safety data"
        evidence_locator: "Well-established use column, Mutagenicity, carcinogenicity heading, third paragraph, rodent-specificity statement"
        scope: ["Well-established use"]
        anchor_id: "32966bcd3520bc37"
        verbatim: "The thyroid gland tumours found in a rat\ncarcinogenicity study and hepatocellular\ncarcinoma found in a mouse carcinogenicity study\nare considered rodent specific, non-genotoxic\nresponse associated (with long-term treatment)\nwith high doses of hepatic enzyme inducers.\nThese types of tumours are not considered\nrelevant to humans."
        evidence_methodology: animal_study
        evidence_outcome: positive_finding
        evaluation_status: evaluated
        interaction_axis: [not_applicable]
        axis_dose_dependence: not_reported
        human_relevance:
          - value: not_relevant
            grade_span: "These types of tumours are not considered\nrelevant to humans"
            bases:
              - basis: species_specific_mechanism
                basis_span: "are considered rodent specific, non-genotoxic\nresponse associated (with long-term treatment)\nwith high doses of hepatic enzyme inducers"
            findings:
              - finding_span: "The thyroid gland tumours found in a rat\ncarcinogenicity study"
              - finding_span: "hepatocellular\ncarcinoma found in a mouse carcinogenicity study"
  reproductive_toxicity:
    citations:
      - citation_status: cited
        source: ema_hmpc
        document_id: EMA/HMPC/321097/2012
        document_published_date: 2015-01-28
        section: "5.3"
        section_title: "Preclinical safety data"
        evidence_locator: "Traditional use column, preclinical safety statement"
        scope: ["Traditional use"]
        anchor_id: "950e54f9b261f972"
        verbatim: "Adequate tests on reproductive toxicity and tests\non genotoxicity and carcinogenicity have not been\nperformed."
        evidence_methodology: regulator_assessment
        evidence_outcome: not_applicable
        evaluation_status: not_evaluated
        interaction_axis: [not_applicable]
        axis_dose_dependence: not_reported
      - citation_status: cited
        source: ema_hmpc
        document_id: EMA/HMPC/321097/2012
        document_published_date: 2015-01-28
        section: "5.3"
        section_title: "Preclinical safety data"
        evidence_locator: "Well-established use column, Reproductive toxicity heading, first two paragraphs"
        scope: ["Well-established use"]
        anchor_id: "c35b32d93844d762"
        verbatim: "Only limited information is available on\nreproductive toxicity of the Ginkgo biloba dry\nextract. The published data are contradictory.\nWhile an older study in rats and rabbits and a\nnewer study in mice revealed no teratogenic,\nembryotoxic or adverse reproductive effects,\nanother study in mice showed effects on\nreproductive parameters, such as fertility and\nreproductive performance and it evoked vaginal\nbleeding. Also tests with unspecified or slightly\ndifferent Ginkgo extracts pointed towards effects\non fetal development (with and without maternal\ntoxicity) or caused subcutaneous bleeding,\nhypopigmentation, growth inhibition and\nanophthalmia in chicken embryos."
