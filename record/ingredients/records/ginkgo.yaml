# ----------------------------------------------------------------------
# PAF antagonism profile
# ----------------------------------------------------------------------

paf_antagonism_profile:
  mechanism_summary: "Ginkgolides A, B, and C antagonize platelet-activating factor (PAF) receptors; ginkgolide B is the most potent. PAF antagonism reduces platelet aggregation and is the mechanism articulated by EMA HMPC assessment report and WHO Vol 1 for ginkgo's antiplatelet pharmacodynamics."
  driver_constituents:
    - ginkgolide_A
    - ginkgolide_B
    - ginkgolide_C
  most_potent_constituent: ginkgolide_B
  citations:
    - citation_status: cited
      source: ema_hmpc
      document_id: EMA/HMPC/321095/2012
      document_published_date: 2015-01-28
      section: "3.1.1"
      section_title: "Primary pharmacodynamic - Inhibitory action on PAF"
      evidence_locator: "Koch 2005 paragraph, PAF-antagonistic activity quantitative IC50s"
      verbatim: "PAF-mediated aggregation of human platelets was half-maximally inhibited (IC50) by ginkgolide A, B, C and EGb 761 at concentrations of 13.7, 1.6, 33.2 microM and 23.2 microg/ml, respectively. Of the ginkgolides tested, ginkgolide B exerted by far the most powerful antagonistic effect."
      evidence_methodology: in_vitro
      evidence_outcome: positive_finding
      attribution_level: drug_specific
      pharmacologic_class: paf_receptor_antagonist
      interaction_axis: [pharmacodynamic]
      axis_dose_dependence: dose_dependent
      effect:
        - parameter: "platelet aggregation"
          direction: "inhibited"
          object: []
          effect_span: "PAF-mediated aggregation of human platelets was half-maximally inhibited (IC50) by ginkgolide A, B, C and EGb 761 at concentrations of 13.7, 1.6, 33.2 microM and 23.2 microg/ml, respectively."
    - citation_status: cited
      source: ema_hmpc
      document_id: EMA/HMPC/321095/2012
      document_published_date: 2015-01-28
      section: "3.1.1"
      section_title: "Primary pharmacodynamic - Inhibitory action on PAF"
      evidence_locator: "Akiba 1998 paragraph, EGb 761 extract IC50"
      verbatim: "Purified ginkgolide A, B and C, which are known to be potent PAF receptor-antagonists, apparently inhibited PAF-induced platelet aggregation, but not oxidant-induced aggregation."
      evidence_methodology: in_vitro
      evidence_outcome: positive_finding
      attribution_level: drug_specific
      pharmacologic_class: paf_receptor_antagonist
      interaction_axis: [pharmacodynamic]
      axis_dose_dependence: not_reported
      effect:
        - parameter: "platelet aggregation"
          direction: "inhibited"
          object: []
          hedge_tokens: ["apparently"]
          effect_span: "which are known to be potent PAF receptor-antagonists, apparently inhibited PAF-induced platelet aggregation"
    - citation_status: retained_pre_scope_lock
      retention_note: "WHO 1999 monograph in scope at Tier 2 for herbal_traditional class, pending extraction."
      source: who
      document_id: WHO/Monographs/Vol1/Folium_Ginkgo
      document_published_date: 1999-12-31
      section: "Pharmacology - Antagonism of platelet-activating factor (PAF)"
      section_title: "Antagonism of platelet-activating factor (PAF)"
      evidence_locator: "Pharmacology section, PAF antagonism paragraph (PDF page 160)"
      verbatim: "The ginkgolides, and in particular ginkgolide B, are known antagonists of PAF. PAF is a potent inducer of platelet aggregation, neutrophil degranulation, and oxygen radical production leading to increased microvascular permeability and bronchoconstriction."
      evidence_methodology: curated_tertiary_synthesis
