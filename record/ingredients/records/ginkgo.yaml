# ----------------------------------------------------------------------
# Bleeding risk profile
# ----------------------------------------------------------------------

bleeding_risk_profile:
  unresolved:
    - class: anchor_gap
      note: "Health Canada NNHPD monograph mono_ginkgo-biloba_english, Cautions and Warnings, the perioperative-use caution. Uncarried: the room holds the document, no extraction is committed for it and no rule module reads it, so no anchor can be resolved yet."
      opened: 2026-09-19
      must_close_by: before_pilot_pass
  substance_level_statement: "Ginkgo extracts may increase susceptibility to bleeding via PAF-antagonism-mediated reduction in platelet aggregation. Case-report literature documents bleeding events in single-organ contexts (eye, nose, cerebral, gastrointestinal); controlled-study and meta-analysis literature does not show increased bleeding risk relative to placebo at recommended doses. Regulator labels reflect both literatures: EMA monograph 4.4 elevates bleeding susceptibility to special-warning placement and recommends consultation in patients with concomitant anticoagulant or antiplatelet treatment, while monograph 4.5 cites the warfarin null finding directly."
