          section_title: "Pharmacokinetic data - Metabolism - Gaudineau et al. 2004"
          verbatim: "EGb 761 inhibited all the P450s studied except CYP2D6 (Ki>900 microg/ml). The activity of CYP2C9 was the most affected by EGb 761 (Ki=14 plus-or-minus 4 microg/ml). CYP1A2 (106 plus-or-minus 24 microg/ml), CYP2E1 (127 plus-or-minus 42 microg/ml), and CYP3A4 (155 plus-or-minus 43 microg/ml) were also inhibited but to a lesser extent."
