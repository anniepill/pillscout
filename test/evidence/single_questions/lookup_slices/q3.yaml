                source: ema_hmpc
                document_id: EMA/HMPC/321095/2012
                section_title: "Pharmacodynamic interactions - Jiang et al. 2005"
                verbatim: "International normalised ratio of prothrombine time and platelet aggregation were not affected by Ginkgo biloba coadministration. Therefore, EGb 761 at recommended doses does not significantly affect clotting status or pharmacodynamics of warfarin in healthy subjects."
                evidence_outcome: null_finding
                conditions: []
