                source: ema_hmpc
                document_id: EMA/HMPC/321097/2012
                section_title: "Interactions with other medicinal products and other forms of interaction"
                verbatim: "Available studies with warfarin do not indicate that\nthere is an interaction between warfarin and G.\nbiloba products, but adequate monitoring is\nadvised when starting, when changing G. biloba\ndose, when ending G. biloba intake or if changing\nproduct."
                evidence_outcome: null_finding
                conditions:
                  - scope: ["Well-established use"]
