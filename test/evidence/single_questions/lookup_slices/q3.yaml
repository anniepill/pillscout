                source: ema_hmpc
                document_id: EMA/HMPC/321097/2012
                section_title: "Interactions with other medicinal products and other forms of interaction"
                verbatim: "If the medicinal product is taken concomitantly\nwith anticoagulants (e.g. phenprocoumon and\nwarfarin) or antiplatelet drugs (e.g. clopidogrel,\nacetylsalicylic acid and other non-steroidal anti-\ninflammatory drugs), their effect may be\ninfluenced."
