                verbatim: "Quercetin was also a strong inhibitor of CYP2C9 (IC50=7.8 microg/ml, 25.8 microM), as was myricetin for CYP2D6 (IC50=9.6 microg/ml, 30.2 microM). It was concluded that a number of flavonol aglycones, as well as the biflavonol amentoflavone, are inhibitors of several human CYP isoforms in vitro. Inhibition of CYP2C9 is of potential concern, since this enzyme is responsible for clearance of some drugs (such as S-warfarin) that have narrow therapeutic ranges in clinical practice. The importance of the in vitro findings requires evaluation in clinical studies."
