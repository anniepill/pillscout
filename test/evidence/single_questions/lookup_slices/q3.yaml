                document_id: EMA/HMPC/7695/2021
                section_title: "Pharmacokinetic properties"
                verbatim: "Hyperforin induces the activity of the metabolic enzymes CYP3A4, CYP2B6, CYP2C9, CYP2C19 and P-glycoprotein dose-dependently via activation of the PXR system. Therefore, the elimination of other drug substances may be accelerated, resulting in decreased plasma concentrations."
                conditions:
                  - applicability_conditions:
                      dose_range:
                        threshold: 1
                        threshold_unit: mg
                        threshold_direction: above
                  - hyperforin_threshold_for_induction: "> 1 mg daily"
          - kind: class
            note: "The source named an enzyme pathway. The lookup service matched this item to it; the source did not name it."
            citations:
              - source: ema_hmpc
                document_id: EMA/HMPC/7695/2021
                section_title: "Pharmacokinetic properties"
                verbatim: "Hyperforin induces the activity of the metabolic enzymes CYP3A4, CYP2B6, CYP2C9, CYP2C19 and P-glycoprotein dose-dependently via activation of the PXR system."
                conditions:
                  - applicability_conditions:
                      dose_range:
                        threshold: 1
                        threshold_unit: mg
                        threshold_direction: above
                  - hyperforin_threshold_for_induction: "> 1 mg daily"
          - kind: class
            note: "The source named an enzyme pathway. The lookup service matched this item to it; the source did not name it."
            citations:
              - source: ema_hmpc
                document_id: EMA/HMPC/7695/2021
                section_title: "Interactions with other medicinal products and other forms of interaction"
                verbatim: "Special care should be taken in case of concomitant use of all drug substances the metabolism of which is influenced by CYP3A4, CYP2B6, CYP2C9, CYP2C19 or P-glycoprotein (e.g., amitriptyline, fexofenadine, alprazolam, diazepam, midazolam, methadone, simvastatin, digoxin, finasteride), because a reduction of plasma concentrations is possible."
