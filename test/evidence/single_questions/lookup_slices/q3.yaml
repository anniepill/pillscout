                source: ema_hmpc
                document_id: EMA/HMPC/321095/2012
                section_title: "Pharmacokinetic data - Metabolism - Gaudineau et al. 2004"
                verbatim: "EGb 761 inhibited all the P450s studied except CYP2D6 (Ki>900 microg/ml). The activity of CYP2C9 was the most affected by EGb 761 (Ki=14 plus-or-minus 4 microg/ml). CYP1A2 (106 plus-or-minus 24 microg/ml), CYP2E1 (127 plus-or-minus 42 microg/ml), and CYP3A4 (155 plus-or-minus 43 microg/ml) were also inhibited but to a lesser extent."
                evidence_outcome: positive_finding
                conditions: []
          - kind: class
            note: "The source named an enzyme pathway. The lookup service matched this item to it; the source did not name it."
            citations:
              - citation_status: cited
                source: ema_hmpc
                document_id: EMA/HMPC/321095/2012
                section_title: "Overall conclusions on clinical pharmacology and efficacy"
                verbatim: "The influence of Ginkgo biloba on drug metabolising CYPs has been demonstrated with various probe substrates for the corresponding CYPs. Both, an inducing and an inhibitory effect were suggested for Ginkgo biloba on CYP3A4 by results of interaction studies, depending on the study design. Whereas a daily dose of 240 mg EGb 761 and extracts other than EGb 761 supposed an inducing effect, a higher daily dose of EGb 761 assumed an inhibitory effect. An induction of CYP2C9 was assumed at a daily dose of 360 mg of EGb 761. Also inducing effects for Ginkgo biloba extracts other than EGb 761 on CYP2C19 were observed."
                evidence_outcome: positive_finding
                conditions:
                  - applicability_conditions:
                      dose_range:
                        threshold: 240
                        threshold_unit: mg
                        threshold_direction: at_or_above
  - pair: "St John's wort with warfarin"
    lookups:
      - record: "St John's wort"
        looking_for: warfarin
        matches:
          - kind: class
            note: "The source named a class. The lookup service matched this item to the class; the source did not name it."
            citations:
              - source: ema_hmpc
                document_id: EMA/HMPC/7695/2021
                section_title: "Contraindications"
                verbatim: "Concomitant use with coumarin-type anticoagulants, cyclosporine, everolimus, sirolimus, tacrolimus for systemic use, fosamprenavir, indinavir and other protease inhibitors, nucleoside reverse transcriptase inhibitors, irinotecan, imatinib and other cytostatic agents metabolised by CYP3A4, CYP2B6, CYP2C9, CYP2C19 or transported by P-glycoprotein."
