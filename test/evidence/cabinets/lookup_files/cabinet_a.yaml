  - passage: "Statin medications reduce cholesterol synthesis. Because endogenous vitamin D is derived from cholesterol, statins may also reduce vitamin D synthesis. In addition, high intakes of vitamin D, especially from supplements, might reduce the potency of atorvastatin (Lipitor), lovastatin (Altoprev and Mevacor), and simvastatin (FloLipid and Zocor), because these statins and vitamin D appear to compete for the same metabolizing enzyme."
