  - passage: "Referring to published case reports the use of Ginkgo biloba has been associated with different bleeding incidents: Spontaneous bleeding of the nose, ecchymosis and haemorrhoidal bleeding (Bent et al. 2005); Postoperative bleeding (Bebbington et al. 2005, Yagmur et al. 2005, Fessenden et al. 2001, Norred and Finlayson 2000); Bleeding complications after liver transplantation (Hauser et al. 2002); Retrobulbar haemorrhage (Fong and Kinnear 2003); Hyphema (Schneider et al. 2002, Rosenblatt and Mindel 1997); Cerebral haemorrhage (Meisel et al. 2003, Benjamin et al. 2001); Subarachnoid haemorrhage (Vale 1998); Parietal lobe haemorrhage (Matthews 1998); Subdural haematoma (Miller and Freeman 2002, Gilbert 1997, Rowin and Lewis 1996)."
    sources:
