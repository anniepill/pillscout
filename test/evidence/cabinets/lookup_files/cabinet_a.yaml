  - passage: "The inhibitory effect of Ginkgo biloba extract on the pharmacokinetics of the P-gp substrate talinolol was studied in healthy volunteers. The observed increase of Cmax by 33% and AUC by 21% without any significant alterations in Tmax and T1/2 of talinolol supports the hypothesis of Blonk et al. (2012): that a possible explanation for the increase in Cmax and bioavailability of a drug when combined with EGb 761 could be the inhibition of P-gp by EGb 761."
