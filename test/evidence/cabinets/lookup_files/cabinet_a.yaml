  - passage: "Calcium. Helps in the development and maintenance of bones/(and) teeth. Helps in the development and maintenance of bones/(and) teeth especially in children and young adults. Adequate calcium (and vitamin D) (throughout life) as part of a healthy diet, (along with physical activity) may reduce the risk of developing osteoporosis (in peri- and postmenopausal women) (in later life). Adequate calcium (and vitamin D) (throughout life) as part of a healthy diet, (along with physical activity) may help prevent bone loss/osteoporosis (in peri- and postmenopausal women) (in later life). As part of a healthy diet (when taken with Vitamin D) may help prevent bone loss/osteoporosis. Source of (an) electrolyte(s)/Provides (an) electrolyte(s). Source of (an) electrolyte(s)/Provides (an) electrolyte(s) for the maintenance of good health. Helps to maintain/support normal muscle function. Helps maintain/support bone health. Helps to prevent calcium deficiency."
