  - passage: "The influence of an aqueous-ethanolic valerian root extract on the metabolic activity of CYP3A4 and CYP2D6 in humans was investigated in an open crossover trial (Donovan et al., 2004). Pharmacokinetic parameters after a single intake of 2 mg alprazolam and 30 mg dextrometorphan (dextrometorphan/dextrorphan ratio) were compared in human volunteers before and after daily intake of 1,000 mg aqueous-ethanolic valerian root dry extract (no further information) over 14 days. The study did not reveal an influence on the CYP2D6 pathway while for CYP3A4 a slight inhibition was shown: Cmax of alprazolam increased after valerian root extract intake from 25+/-7 ng/ml to 31+/-8 vs (p<0.05), the AUC at baseline was 88.9% of the AUC after valerian root extract intake (n.s.). The authors rated the magnitude of this moderate increase not as clinically relevant and concluded that valerian root is unlikely to have clinically relevant effects on the disposition of medications primarily dependent on the CYP2D6 or the CYP3A4 pathways."
    sources:
