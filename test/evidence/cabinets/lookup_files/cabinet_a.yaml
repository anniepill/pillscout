  - passage: "Although you label and promote CholesLo as a dietary supplement, laboratory analyses of two samples collected by the FDA determined that this product contains lovastatin. Lovastatin is the active ingredient in Mevacor and its generic counterparts, which are FDA-approved drugs used to treat patients with primary hypercholesterolemia. Traditional red yeast rice does not contain more than trace amounts of lovastatin, if any. Because your CholesLo product contains red yeast rice with enhanced or added lovastatin, it cannot be marketed as a dietary supplement. Section 201(ff)(3)(B)(i) of the Act [21 U.S.C. 321(ff)(3)(B)(i)] specifically excludes from the dietary supplement definition articles that are approved as new drugs under section 505, unless the article was marketed as a dietary supplement or food before its approval as a new drug."
