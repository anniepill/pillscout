  - passage: "Calcium carbonate supplements can interfere with the absorption of levothyroxine (Synthroid, Levoxyl, and others), a thyroid hormone used to treat hypothyroidism and thyroid cancer. The FDA-approved label for this medication instructs patients who are taking calcium carbonate supplements to avoid taking levothyroxine within 4 hours of taking the supplement."
