  - passage: "According to the pharmacovigilance database of the BfArM 74 cases of haemorrhage during the intake of Ginkgo biloba medicinal products are reported in Germany (June 20, 2012). It should be kept in mind that these are suspected cases of adverse events and a causal link on an individual basis is not proven with certainty. The specific location of bleeding incidences of reported adverse events (with 5 or more than 5 cases mentioned) are as followed: epistaxis, cerebral haemorrhage, gastrointestinal haemorrhage, gastric ulcer haemorrhage, haematoma, eye haemorrhage, melaena and decreased haemoglobin value. Included in the 74 reported adverse events are five cases of deaths."
    sources:
