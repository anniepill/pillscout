  - passage: "PAF-mediated aggregation of human platelets was half-maximally inhibited (IC50) by ginkgolide A, B, C and EGb 761 at concentrations of 13.7, 1.6, 33.2 microM and 23.2 microg/ml, respectively. Of the ginkgolides tested, ginkgolide B exerted by far the most powerful antagonistic effect."
