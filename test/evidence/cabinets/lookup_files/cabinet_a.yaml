  - passage: "The influence of Ginkgo biloba on drug metabolising CYPs has been demonstrated with various probe substrates for the corresponding CYPs. Both, an inducing and an inhibitory effect were suggested for Ginkgo biloba on CYP3A4 by results of interaction studies, depending on the study design. Whereas a daily dose of 240 mg EGb 761 and extracts other than EGb 761 supposed an inducing effect, a higher daily dose of EGb 761 assumed an inhibitory effect. An induction of CYP2C9 was assumed at a daily dose of 360 mg of EGb 761. Also inducing effects for Ginkgo biloba extracts other than EGb 761 on CYP2C19 were observed."
