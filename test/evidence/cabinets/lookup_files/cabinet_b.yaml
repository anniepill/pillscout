  - passage: "Curcumin was found to inhibit the P-gp and CYP3A4 activities in vitro, and to activate CYP3A4 and suppresses P-gp abilities in vivo. (Cheng et al., 2018). Drug interaction was observed in several clinical trials after co-administration of Curcuma longa or curcumin with talinolol, endoxifen, sulphasalazine and tamoxifen. However, the dose of curcumin (300 mg per day, 1200mg 3dd or 2 g per day) used in these studies is higher than the maximum daily dose of 4 g Curcuma longa (corresponding to a maximum of 209 mg curcuminoids) recommended in the monograph."
    sources:
