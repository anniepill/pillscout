  - passage: "Importantly, means of increasing the bioavailability of curcumin were developed using piperine (black pepper) or lipid nanoparticle delivery methods to increase absorption. These high bioavailability forms of purified curcumin were subsequently linked to several cases of liver injury and mentioned as a possible cause of outbreaks of acute hepatitis with jaundice in Italy."
    sources:
      - item: "curcumin"
        authority: "NIH LiverTox"
        document_id: "NBK548561"
        section_title: "Bioavailability enhancement and liver injury"
        evidence_outcome: "positive_finding"
    bears_on:
      - pair: "curcumin + piperine"
        kind: "named"
        partner: "piperine"
  - passage: "Papke et al., 2025 identified via a retrospective pathology archive review, 11 patients with turmeric supplement-associated hepatitis. Their Roussel Uclaf causality assessment method (RUCAM) analysis estimated the likelihood of turmeric supplement-associated liver injury to be probable (eight cases) and possible (three). However, in the majority of the reported cases the preparation and the dose used were unknown. In those cases when this information was available patients had used high amounts of curcuminoids and/or turmeric combined with black pepper and in all cases, there was concomitant use of other supplements/ medicinal products."
    sources:
      - item: "curcumin"
        authority: "European Medicines Agency (herbal committee)"
        document_id: "EMA/HMPC/81467/2025"
        section_title: "Papke et al. 2025 - turmeric/piperine hepatitis"
        evidence_outcome: "positive_finding"
    bears_on:
      - pair: "curcumin + piperine"
        kind: "named_elsewhere"
        note: "This passage names the item. The record files it under a different heading."
  - passage: "Shoba et al. demonstrated that the bioavailability of curcumin increased twenty-fold when healthy human subjects took a 2 g dose of curcumin in combination with 20 mg of piperine, extracted from black pepper, compared to subjects who took only 2 g of curcumin (Shoba et al., 1998)."
    sources:
      - item: "curcumin"
        authority: "European Medicines Agency (herbal committee)"
        document_id: "EMA/HMPC/329745/2017"
        section_title: "Drug interactions and other forms of interaction"
        evidence_outcome: "positive_finding"
    bears_on:
      - pair: "curcumin + piperine"
        kind: "named"
        partner: "piperine"
  - passage: "In those cases where these details were provided, products often contain a pepper (extract) to increase the bioavailability of curcumin, and/or the daily intake of Curcuma longa and/curcumin was higher than the posology of the EU herbal monograph."
    sources:
