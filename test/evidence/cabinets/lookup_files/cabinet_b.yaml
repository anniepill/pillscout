        evidence_outcome: "positive_finding"
    bears_on:
      - pair: "curcumin + piperine"
        kind: "named"
        partner: "piperine"
  - passage: "Turmeric may interact with NSAIDs (Non-Steroidal Anti-inflammatory Drugs), antiplatelet agents or antihyperlipidemics, and a case report mentions interaction with warfarin. These findings are mainly based on in vitro data, animal studies or individual case reports. More studies are needed to confirm and assess the clinical significance of these potential interactions (Bowman 2005, Fetrow and Avila 1999, Heck et al., 2000). As clinical data is lacking, these effects are not included in the monograph."
    sources:
      - item: "curcumin"
        authority: "European Medicines Agency (herbal committee)"
        document_id: "EMA/HMPC/329745/2017"
        section_title: "Drug interactions and other forms of interaction"
