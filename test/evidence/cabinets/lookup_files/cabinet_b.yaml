  - passage: "A \"Ginseng Abuse Syndrome\" has been described in literature, defined as hypertension together with nervousness, sleeplessness, skin eruptions, edema and morning diarrhoea after long-term use of daily doses of up to 15 g of \"ginseng (-preparations)\". However, the used preparations were not clearly defined and included also Panax quinquefolius, Eleutherococcus senticosus and Rumex hymenosepalus. Furthermore, the preparations were not only used orally but also intranasal or by injection and all of the persons reporting the syndrome consumed caffeinated beverages concomitantly. Due to the questionable causality and with regard to the limited recommended daily dose of 6 g and duration of use for not longer than three months, these findings are not regarded to be relevant for safety considerations."
